  <style>
    :root {

    .dot-a { top: 18%; left: 15%; } .dot-b { right: 14%; bottom: 23%; width: 3px; height: 3px; }
    .hero-rule { position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg,transparent,rgba(212,175,55,.35),rgba(231,232,234,.2),transparent); }

    .product-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .product-icon { display: grid; place-items: center; width: 47px; height: 47px; flex: 0 0 auto; border: 1px solid rgba(212,175,55,.36); border-radius: 12px; background: linear-gradient(145deg,#292315,#111); color: var(--gold-light); }
    .product-icon svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    .product-price small { font-size: .7rem; letter-spacing: .08em; color: #8f8f95; -webkit-text-fill-color: #8f8f95; font-weight: 600; }

    .contact-panel h2 { font-size: clamp(1.7rem,3vw,2.5rem); margin-bottom: 8px; }

      .hero-copy > p { font-size: .94rem; }
      .hero-art { min-height: 320px; margin-top: 4px; }
      .emblem { width: min(65%,245px); }

      .orbit { width: min(100%,330px); }
      .label-top { right: 2%; top: 9%; }

      .section { padding: 72px 0; }
      .section-head { margin-bottom: 30px; text-align: left; }

      .product-grid { grid-template-columns: 1fr; gap: 14px; }

    }
    @media (prefers-reduced-motion: reduce) {

    }
  </style>
</head>
